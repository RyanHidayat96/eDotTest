appId: ${EWORK_APP_ID}
---
# Home menu item has repeated generic IDs in hierarchy; text fallback is the captured stable locator.
- scrollUntilVisible:
    element:
      text: ${EWORK_CUSTOMERS_MENU_TEXT}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${EWORK_CUSTOMERS_MENU_TEXT}
- assertVisible: New Customer List
- tapOn:
    id: ${EWORK_ADD_CUSTOMER_BUTTON_ID}
- assertVisible: New Customer Registration
- tapOn:
    id: ${EWORK_CUSTOMER_NAME_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_NAME}
- tapOn:
    id: ${EWORK_CUSTOMER_CONTACT_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_CONTACT}
- hideKeyboard
- tapOn:
    id: ${EWORK_CUSTOMER_CONTACT_PERSON_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_CONTACT_PERSON}
- hideKeyboard
- tapOn:
    id: ${EWORK_CUSTOMER_CHANNEL_FIELD_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_CHANNEL_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_TYPE_FIELD_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_TYPE_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_BASIC_CONTINUE_BUTTON_ID}
- assertVisible: Locations
- tapOn:
    id: ${EWORK_CUSTOMER_ADDRESS_TYPE_FIELD_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_ADDRESS_TYPE_OPTION_TEXT}
- assertVisible: ${EWORK_CUSTOMER_ADDRESS_TYPE_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_CURRENT_LOCATION_BUTTON_ID}
- scrollUntilVisible:
    element:
      id: ${EWORK_CUSTOMER_ADDRESS_FIELD_ID}
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: ${EWORK_CUSTOMER_ADDRESS_FIELD_ID}
- copyTextFrom:
    id: ${EWORK_CUSTOMER_ADDRESS_FIELD_ID}
- evalScript: ${output.customerAddress = maestro.copiedText.trim()}
- assertTrue: ${output.customerAddress.length > 0 && !output.customerAddress.includes('Choose') && !output.customerAddress.includes('Input')}
# Customer list card truncates long addresses, so validate the visible first address segment.
- evalScript: ${output.customerCardAddress = output.customerAddress.split(',')[0].trim()}
- tapOn:
    text: ${EWORK_CUSTOMER_PROVINCE_FIELD_TEXT}
- tapOn:
    text: ${EWORK_CUSTOMER_PROVINCE_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_LOCATION_APPLY_BUTTON_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_CITY_FIELD_TEXT}
- tapOn:
    text: ${EWORK_CUSTOMER_CITY_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_LOCATION_APPLY_BUTTON_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_DISTRICT_FIELD_TEXT}
- tapOn:
    text: ${EWORK_CUSTOMER_DISTRICT_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_LOCATION_APPLY_BUTTON_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_SUBDISTRICT_FIELD_TEXT}
- tapOn:
    text: ${EWORK_CUSTOMER_SUBDISTRICT_OPTION_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_LOCATION_APPLY_BUTTON_ID}
# The app may advance to Documents after the final location choice; otherwise Continue is the only exposed stable text.
- tapOn:
    text: Continue
    optional: true
- assertVisible: KTP *
- tapOn:
    id: ${EWORK_CUSTOMER_KTP_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_KTP_NUMBER}
- hideKeyboard
- tapOn:
    id: ${EWORK_CUSTOMER_UPLOAD_BUTTON_ID}
- tapOn:
    id: ${EWORK_CUSTOMER_CAMERA_CAPTURE_BUTTON_ID}
- assertVisible: Preview
- tapOn:
    id: ${EWORK_CUSTOMER_DOCUMENT_SUBMIT_BUTTON_ID}
- assertVisible: ${EWORK_CUSTOMER_SIGNATURE_TITLE_TEXT}
- assertVisible:
    id: ${EWORK_CUSTOMER_SIGNATURE_VIEW_ID}
# Signature canvas has no text input or semantic value; pointer stroke is required by the widget.
- swipe:
    start: "20%, 70%"
    end: "80%, 70%"
    duration: 500
- tapOn:
    id: ${EWORK_CUSTOMER_SAVE_BUTTON_ID}
- tapOn:
    id: ${EWORK_CUSTOMER_SAVE_CONFIRM_BUTTON_ID}
- assertVisible: ${EWORK_CUSTOMER_SUCCESS_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMER_SUCCESS_CONTINUE_BUTTON_ID}
- assertVisible: New Customer List
# New records land at the bottom. The list exposes no search field and cards do not open detail.
- swipe:
    start: "50%, 90%"
    end: "50%, 15%"
    duration: 50
# Tier 2: created customer name must appear after save.
- assertVisible: ${EWORK_CUSTOMER_NAME}
# Tier 2: created customer address must match current-location address shown on the card.
- assertVisible: ${output.customerCardAddress}
# Tier 2: created customer type must match submitted data.
- assertVisible: ${EWORK_CUSTOMER_TYPE_OPTION_TEXT}
