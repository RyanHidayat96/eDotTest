appId: ${EWORK_APP_ID}
---
- runFlow: open_customer_list.yaml
- tapOn:
    id: ${EWORK_ADD_CUSTOMER_BUTTON_ID}
- assertVisible: New Customer Registration
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/01-registration-page-opened
- tapOn:
    id: ${EWORK_CUSTOMER_NAME_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_NAME}
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/02-outlet-name-entered
- tapOn:
    id: ${EWORK_CUSTOMER_CONTACT_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_CONTACT}
- hideKeyboard
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/03-contact-entered
- tapOn:
    id: ${EWORK_CUSTOMER_CONTACT_PERSON_FIELD_ID}
- inputText: ${EWORK_CUSTOMER_CONTACT_PERSON}
- hideKeyboard
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/04-contact-person-entered
- tapOn:
    id: ${EWORK_CUSTOMER_CHANNEL_FIELD_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_CHANNEL_OPTION_TEXT}
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/05-channel-selected
- tapOn:
    id: ${EWORK_CUSTOMER_TYPE_FIELD_ID}
- tapOn:
    text: ${EWORK_CUSTOMER_TYPE_OPTION_TEXT}
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/06-customer-type-selected
- tapOn:
    id: ${EWORK_CUSTOMER_BASIC_CONTINUE_BUTTON_ID}
- assertVisible: Locations
- takeScreenshot: reports/maestro-screenshots/create_customer_basic/07-locations-page-opened
