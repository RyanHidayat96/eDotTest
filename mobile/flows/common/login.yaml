appId: ${EWORK_APP_ID}
---
- extendedWaitUntil:
    visible:
      text: ${EWORK_LOGIN_SCREEN_TEXT}
    timeout: 30000
- tapOn:
    id: ${EWORK_COMPANY_ID_FIELD_ID}
- inputText: ${EWORK_COMPANY_CODE}
- takeScreenshot: reports/maestro-screenshots/login/02-company-id-entered
- tapOn:
    id: ${EWORK_USERNAME_FIELD_ID}
- inputText: ${EWORK_EMAIL}
- takeScreenshot: reports/maestro-screenshots/login/03-username-entered
- tapOn:
    id: ${EWORK_PASSWORD_FIELD_ID}
- inputText: ${EWORK_PASSWORD}
- takeScreenshot: reports/maestro-screenshots/login/04-password-entered
- tapOn:
    id: ${EWORK_LOGIN_BUTTON_ID}
