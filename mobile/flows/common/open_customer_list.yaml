appId: ${EWORK_APP_ID}
---
# Home menu items share text-heavy cells; tap the parent cell that contains the exact New Customer label.
- tapOn:
    text: OK
    optional: true
- tapOn:
    text: Close
    optional: true
- scrollUntilVisible:
    element:
      id: ${EWORK_CUSTOMERS_MENU_ID}
      containsDescendants:
        - text: ${EWORK_CUSTOMERS_MENU_TEXT}
    direction: DOWN
    timeout: 15000
    centerElement: true
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: ${EWORK_CUSTOMERS_MENU_ID}
    containsDescendants:
      - text: ${EWORK_CUSTOMERS_MENU_TEXT}
- tapOn:
    id: ${EWORK_CUSTOMERS_MENU_ID}
    containsDescendants:
      - text: ${EWORK_CUSTOMERS_MENU_TEXT}
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: OK
    optional: true
- tapOn:
    text: Close
    optional: true
- tapOn:
    id: ${EWORK_CUSTOMERS_MENU_ID}
    containsDescendants:
      - text: ${EWORK_CUSTOMERS_MENU_TEXT}
    optional: true
    waitToSettleTimeoutMs: 1000
- assertVisible: New Customer List
- takeScreenshot: 00-click-new-customer-menu-from-home-expected-new-customer-list-page-is-displayed
