appId: ${EWORK_APP_ID}
---
- launchApp
- tapOn:
    text: Always allow
    optional: true
- tapOn:
    text: Allow once
    optional: true
- extendedWaitUntil:
    visible:
      text: ${EWORK_LOGIN_SCREEN_TEXT}
    timeout: 30000
- takeScreenshot: 01-open-ework-app-expected-login-page-is-displayed
- runFlow: common/login.yaml
- takeScreenshot: 02-enter-ework-login-credentials-expected-company-id-username-and-password-fields-are-filled
- tapOn:
    id: ${EWORK_LOGIN_BUTTON_ID}
- assertVisible: ${EWORK_DASHBOARD_TEXT}
- takeScreenshot: 03-submit-ework-login-expected-dashboard-is-displayed
