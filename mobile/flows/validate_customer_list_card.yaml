appId: ${EWORK_APP_ID}
---
- assertVisible: New Customer List
# Tier 2: created customer name must appear on the visible customer card.
- assertVisible:
    id: id.edot.ework:id/tv_name
    text: ${EWORK_CUSTOMER_NAME}
# Tier 2: created customer address must match the current-location address shown on the card.
- assertVisible:
    id: id.edot.ework:id/tv_address
    text: ${EWORK_CUSTOMER_CARD_ADDRESS}
# Tier 2: created customer type must match submitted data.
- assertVisible:
    id: id.edot.ework:id/tv_first_customer_group
    text: ${EWORK_CUSTOMER_TYPE_OPTION_TEXT}
- takeScreenshot: reports/maestro-screenshots/validate_customer_list_card/01-verify-created-customer-card-expected-name-address-and-customer-type-match-submitted-data
