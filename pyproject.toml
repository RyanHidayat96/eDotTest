[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edot-qa-automation"
version = "0.1.0"
description = "eDOT QA Automation Engineer take-home test implementation."
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13.5",
    "Faker>=26.0.0",
    "playwright>=1.49.0",
    "pydantic>=2.8.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["edot_qa*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --alluredir=reports/allure-results"
markers = [
    "ai: AI data generation and triage tests",
    "mobile: mobile eWork SFA tests",
    "web: web eSuite tests",
    "requires_credentials: test requires secure runtime credentials",
    "requires_cleanup: test creates data and requires cleanup support",
    "requires_device: test requires an adb-visible mobile device",
    "requires_maestro: test requires Maestro CLI",
    "requires_storage_state: test requires an existing Playwright storage_state file",
]
pythonpath = ["."]
testpaths = ["tests"]
